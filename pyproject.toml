[project]
name = "fluxctl"
version = "0.3.4"
description = "Modular SCP flux imaging toolkit"
authors = [{name = "Fluxctl Maintainers"}]
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.11"
dependencies = [
    "bitarray>=3.8.0",
    "typer>=0.9.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
greaseweazle = [
    "pyserial>=3.5",
    "crcmod>=1.7",
    "requests>=2.31",
]
hxcfe = []
gui = [
    "PySide6>=6.7",
]
packaging = [
    "build>=1.2",
    "pyinstaller>=6.0",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/GeoKM/fluxctl"
Repository = "https://github.com/GeoKM/fluxctl"

[project.scripts]
fluxctl = "fluxctl.cli:app"
fluxctl-studio = "fluxctl.gui:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fluxctl" = ["data/layouts/*.json"]
