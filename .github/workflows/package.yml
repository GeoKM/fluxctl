name: Package

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/package.yml"
      - "packaging/**"
      - "scripts/build_packages.py"
      - "scripts/build_release.py"
      - "scripts/assemble_release.py"
      - "scripts/smoke_release.py"
      - "src/fluxctl/integrations.py"
      - "src/fluxctl/native.py"
      - "src/fluxctl/drive_diagnostics.py"
  workflow_dispatch:

jobs:
  python-distributions:
    name: Build Python distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packaging tools
        run: python -m pip install -e ".[packaging]"
      - name: Build wheel and sdist
        run: python scripts/build_packages.py
      - name: Validate Python distributions
        run: python -m twine check dist/*
      - name: Upload Python artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*

  standalone:
    name: Build integrated installer ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset: "*.dmg"
          - os: windows-latest
            asset: "*.exe"
          - os: ubuntu-22.04
            asset: "*.AppImage"
          - os: ubuntu-22.04-arm
            asset: "*.AppImage"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: misterblack1/greaseweazle
          ref: a4cd3952c81f6e72db044a47085065f3e01f0ae6
          path: vendor/greaseweazle
      - uses: actions/checkout@v4
        with:
          repository: jfdelnero/HxCFloppyEmulator
          ref: HxCFloppyEmulator_V2_16_10_1
          path: vendor/hxc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python build inputs
        run: |
          python -m pip install -e ".[gui,greaseweazle,packaging]"
          python -m pip install ./vendor/greaseweazle
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes build-essential libusb-1.0-0-dev libudev-dev libegl1
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          install: >-
            make
            gcc
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-pkgconf
      - name: Build HxCFE on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          command -v gcc ar windres /usr/bin/gcc
          make -C vendor/hxc/build TARGET=mingw64 'CC=gcc -std=gnu17 -Wno-error=incompatible-pointer-types' AR=ar RESC=windres BUILD_CC=/usr/bin/gcc HxCFloppyEmulator_cmdline
      - name: Build HxCFE on macOS and Linux
        if: runner.os != 'Windows'
        run: make -C vendor/hxc/build HxCFloppyEmulator_cmdline
      - name: Build Rust decoder
        run: cargo build --manifest-path native/fluxctl_native/Cargo.toml --release
      - name: Build integrated standalone apps
        run: python scripts/build_release.py --hxc-root vendor/hxc --gw-root vendor/greaseweazle
      - name: Smoke test outside checkout
        run: python scripts/smoke_release.py
      - name: Assemble macOS DMG
        if: runner.os == 'macOS'
        run: python scripts/assemble_release.py
      - name: Install Windows installer compiler
        if: runner.os == 'Windows'
        run: choco install innosetup --yes --no-progress
      - name: Assemble Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe" -ErrorAction Stop | Select-Object -First 1 -ExpandProperty FullName
          python scripts/assemble_release.py --iscc "$compiler"
      - name: Fetch pinned Linux AppImage tool
        if: runner.os == 'Linux'
        run: |
          arch="$(uname -m)"
          case "$arch" in
            x86_64|aarch64) ;;
            *) echo "Unsupported AppImage architecture: $arch" >&2; exit 1 ;;
          esac
          curl --fail --location --retry 3 --output appimagetool.AppImage "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-${arch}.AppImage"
          chmod +x appimagetool.AppImage
      - name: Assemble Linux AppImage
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: python scripts/assemble_release.py --appimagetool ./appimagetool.AppImage
      - name: Smoke test assembled Linux AppImage
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          appimages=(dist/release/*.AppImage)
          test "${#appimages[@]}" -eq 1
          "${appimages[0]}" --cli doctor --json > dist/release/appimage-doctor.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("dist/release/appimage-doctor.json").read_text())
          checks = {check["name"]: check for check in report["checks"]}
          for name in ("native acceleration", "greaseweazle", "gw command", "gw diagnostics", "hxcfe"):
              assert checks[name]["status"] == "ok", checks[name]
          print("Assembled AppImage doctor passed")
          PY
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluxctl-installer-${{ matrix.os }}
          path: dist/release/${{ matrix.asset }}
          if-no-files-found: error
