name: Bug report
description: Report an installation, Studio, CLI, or hardware integration problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping test Fluxctl. Please describe what happened and include
        the exact installer filename if you used a release download.
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Installer or first launch
        - Fluxctl Studio
        - Command line
        - Greaseweazle or drive hardware
        - HxCFE integration
        - Native decoder
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Fluxctl version or installer filename
      placeholder: Fluxctl-0.3.8-windows-x64-setup.exe
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and architecture
      placeholder: Windows 11 x64, macOS 15 arm64, or Ubuntu 22.04 x86_64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the command or Studio action, input format, and any connected drive hardware when relevant.
      placeholder: |
        1. Install or launch Fluxctl...
        2. Open a file or run a command...
        3. Observe the problem...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include the complete error message or a screenshot if available.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Fluxctl doctor output
      description: Paste `fluxctl doctor --json` output, or say why the command could not run.
      render: json
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Additional logs or context
      description: Add relevant logs or details that help reproduce the issue.
    validations:
      required: false
